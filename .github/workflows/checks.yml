# On every push and pull request: service tests, Python/TypeScript parity, and a Next.js build.
name: Checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Payout state service tests
        run: python -m unittest -v
      - name: Python and TypeScript services match
        run: npm run parity
      - name: Next.js build
        run: npm run build
